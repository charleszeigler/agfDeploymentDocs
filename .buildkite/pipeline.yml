# Live GitHub host. These are the same three checks `dagger call ci` runs.
# Hosted linux-small + Docker plugin is already green on this pipeline.
# Dagger/Cloud Build is the portable/GCP path; see ci/README.md.

steps:
  - label: ":nodejs: syntax-check coordinator"
    command: node --check templates/deploy.mjs
    agents:
      queue: linux-small
    plugins:
      - docker#v5.14.0:
          image: "node:20"

  - label: ":nodejs: unit-test coordinator"
    command: node --test tests/deploy.test.mjs tests/check-coverage.test.mjs
    agents:
      queue: linux-small
    plugins:
      - docker#v5.14.0:
          image: "node:20"

  - label: ":nodejs: docs, nav, and manifests"
    command: node scripts/ci-check.mjs
    agents:
      queue: linux-small
    plugins:
      - docker#v5.14.0:
          image: "node:20"

  - wait

  - label: ":salesforce: scratch org"
    command: |
      set -euo pipefail
      if [ -z "${SF_DEVHUB_AUTH_URL:-}" ]; then
        echo "SKIP org CI: set SF_DEVHUB_AUTH_URL (Dev Hub sfdx auth url) on this pipeline"
        exit 0
      fi
      docker run --rm \
        -e SF_DEVHUB_AUTH_URL \
        -e BUILDKITE_BUILD_ID \
        -v "$PWD":/src -w /src \
        mcr.microsoft.com/playwright:v1.55.0-jammy \
        bash -lc 'npm install -g @salesforce/cli && bash ci/sf/org-ci.sh'
    agents:
      queue: linux-small
    timeout_in_minutes: 30
