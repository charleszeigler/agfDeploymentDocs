# Live GitHub host. These are the same three checks `dagger call ci` runs.
# Hosted linux-small + Docker plugin is already green on this pipeline.
# Dagger/Cloud Build is the portable/GCP path; see ci/README.md.

steps:
  - label: ":nodejs: syntax-check coordinator"
    command: node --check templates/deploy.mjs
    agents:
      queue: linux-small
    plugins:
      - docker#v5.14.0:
          image: "node:20"

  - label: ":nodejs: unit-test coordinator"
    command: node --test tests/deploy.test.mjs
    agents:
      queue: linux-small
    plugins:
      - docker#v5.14.0:
          image: "node:20"

  - label: ":nodejs: docs, nav, and manifests"
    command: node scripts/ci-check.mjs
    agents:
      queue: linux-small
    plugins:
      - docker#v5.14.0:
          image: "node:20"
