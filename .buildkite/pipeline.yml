# Host for the Dagger pipeline. Logic lives in dagger/src/index.ts.
# Hosted linux-small agents already have Docker, so Dagger can start its engine
# without the Docker plugin. See .buildkite/README.md and ci/README.md.

steps:
  - label: ":dagger: ci"
    command: |
      set -euo pipefail
      mkdir -p "$HOME/.local/bin"
      curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.21.9 BIN_DIR="$HOME/.local/bin" sh
      export PATH="$HOME/.local/bin:$PATH"
      export DAGGER_NO_NAG=1
      dagger version
      dagger call ci --source . --progress=plain
    agents:
      queue: linux-small
    timeout_in_minutes: 15
