# Host for the Dagger pipeline. Pipeline logic lives in dagger/src/index.ts.
# Installs a pinned Dagger CLI, runs static `dagger call ci`, then the scratch-org
# smoke: `dagger call org-ci-jwt` when SF_JWT_KEY is wired (JWT Dev Hub auth),
# else `dagger call org-ci` when SF_DEVHUB_AUTH_URL is set, else skip. Wire the
# secrets via availableSecrets/secretEnv (see ci/README.md). Docker builder has a
# client; Cloud Build mounts the daemon.

steps:
  - name: gcr.io/cloud-builders/docker
    id: dagger-ci
    entrypoint: bash
    env:
      - DAGGER_NO_NAG=1
    args:
      - -ceu
      - |
        if ! command -v curl >/dev/null 2>&1; then
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl ca-certificates
        fi
        mkdir -p /workspace/.bin
        curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.21.9 BIN_DIR=/workspace/.bin sh
        export PATH="/workspace/.bin:$$PATH"
        dagger version
        dagger call ci --source . --progress=plain
        if [ -n "$${SF_JWT_KEY:-}" ]; then
          dagger call org-ci-jwt --source . \
            --jwt-key env://SF_JWT_KEY \
            --consumer-key "$${SF_CONSUMER_KEY}" \
            --hub-username "$${SF_HUB_USERNAME}" \
            --progress=plain
        elif [ -n "$${SF_DEVHUB_AUTH_URL:-}" ]; then
          dagger call org-ci --source . --devhub-auth-url env://SF_DEVHUB_AUTH_URL --progress=plain
        else
          echo "SKIP org CI: wire SF_JWT_KEY (+ SF_CONSUMER_KEY, SF_HUB_USERNAME) or SF_DEVHUB_AUTH_URL"
        fi

timeout: 2400s
options:
  logging: CLOUD_LOGGING_ONLY
