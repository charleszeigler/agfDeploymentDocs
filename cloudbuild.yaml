# Host for the Dagger pipeline. Pipeline logic lives in dagger/src/index.ts.
# Installs a pinned Dagger CLI, runs static `dagger call ci`, then scratch-org
# `dagger call org-ci` when SF_DEVHUB_AUTH_URL is set. Docker builder has a
# client; Cloud Build mounts the daemon.

steps:
  - name: gcr.io/cloud-builders/docker
    id: dagger-ci
    entrypoint: bash
    env:
      - DAGGER_NO_NAG=1
    args:
      - -ceu
      - |
        if ! command -v curl >/dev/null 2>&1; then
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl ca-certificates
        fi
        mkdir -p /workspace/.bin
        curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.21.9 BIN_DIR=/workspace/.bin sh
        export PATH="/workspace/.bin:$$PATH"
        dagger version
        dagger call ci --source . --progress=plain
        if [ -n "$${SF_DEVHUB_AUTH_URL:-}" ]; then
          dagger call org-ci --source . --devhub-auth-url env://SF_DEVHUB_AUTH_URL --progress=plain
        else
          echo "SKIP org CI: set SF_DEVHUB_AUTH_URL (Dev Hub sfdx auth url) or wire Secret Manager"
        fi

timeout: 2400s
options:
  logging: CLOUD_LOGGING_ONLY
